name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # logins that skip the strict per-PR profile rules (maintainers with
  # maintain/admin permission are skipped automatically, too)
  PROFILE_BYPASS: hnrobert

jobs:
  check-profiles:
    name: Check profiles/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect the PR's changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | [.status, .filename] | @tsv' > pr-files.tsv
          cat pr-files.tsv

      # The strict rules (exactly one file, named after the PR author)
      # apply only to PRs from docs/* branches, and never to bypassed
      # logins or maintain/admin collaborators.
      - name: Decide whether the strict profile rules apply
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          bypass=no
          for user in $PROFILE_BYPASS; do
            [ "$user" = "$PR_AUTHOR" ] && bypass=yes
          done
          if [ "$bypass" = no ]; then
            perm=$(gh api "repos/${{ github.repository }}/collaborators/$PR_AUTHOR/permission" \
              --jq .permission 2>/dev/null || echo none)
            case "$perm" in maintain|admin) bypass=yes ;; esac
          fi
          strict=no
          if [ "$bypass" = no ] && [[ "$branch" == docs/* ]]; then
            strict=yes
          fi
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "branch=$branch author=$PR_AUTHOR bypass=$bypass strict=$strict"

      - name: Run the profiles check
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "${{ steps.scope.outputs.strict }}" = yes ] && [ -f pr-files.tsv ]; then
            python scripts/check_profiles.py --author "${PR_AUTHOR}" --pr-files pr-files.tsv
          else
            python scripts/check_profiles.py
          fi

  publish-site:
    name: Build and deploy the roster site
    needs: check-profiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the roster page
        run: python scripts/build_site.py

      # Keep docs/index.html in the repo so that student forks can still
      # serve Pages the manual way (Settings -> Pages -> branch main /docs).
      - name: Commit the rebuilt docs back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "docs/index.html is up to date — nothing to commit."
          else
            git commit -m "chore: rebuild pages roster from profiles"
            git pull --rebase
            git push
          fi

      # Deploy https://comppsyunion.github.io/github-playground/ straight
      # from the workflow (Pages source: GitHub Actions).
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
