name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-profiles:
    name: Check profiles/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the profiles check
        run: python scripts/check_profiles.py

  publish-site:
    name: Build and deploy the roster site
    needs: check-profiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the roster page
        run: python scripts/build_site.py

      # Keep docs/index.html in the repo so that student forks can still
      # serve Pages the manual way (Settings -> Pages -> branch main /docs).
      - name: Commit the rebuilt docs back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "docs/index.html is up to date — nothing to commit."
          else
            git commit -m "chore: rebuild pages roster from profiles"
            git push
          fi

      # Deploy https://comppsyunion.github.io/github-playground/ straight
      # from the workflow (Pages source: GitHub Actions).
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
