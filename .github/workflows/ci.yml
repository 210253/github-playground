name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-profiles:
    name: Check profiles/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the profiles check
        run: python scripts/check_profiles.py

  rebuild-site:
    name: Rebuild Pages roster
    needs: check-profiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate docs/index.html from profiles/
        run: python scripts/build_site.py
      - name: Commit the rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Site is up to date — nothing to commit."
          else
            git commit -m "chore: rebuild pages roster from profiles"
            git push
          fi
