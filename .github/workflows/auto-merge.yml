name: Auto-merge

# Merging must live in its own workflow_run-triggered workflow: for PRs
# opened from forks, the GITHUB_TOKEN inside the pull_request CI run is
# read-only on the base repo by design ("Resource not accessible by
# integration"). workflow_run executes in the base repository context
# with write permissions. This workflow only makes API calls — it never
# checks out pull request code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  squash-merge:
    name: Squash merge passing docs PRs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find the open PR for this head SHA
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api "repos/${{ github.repository }}/pulls?state=open" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\" and .draft == false and .base.ref == \"main\") | .number" \
            | head -n1 || true)"
          if [ -z "$pr" ]; then
            echo "No matching open PR — nothing to merge."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.ref)"
          body="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.body // empty')"
          case "$branch" in
            docs/*|fix/*) ;;
            *)
              # any other branch merges too when the PR body asks for it
              if printf '%s' "$body" | grep -qi '\[auto merge\]'; then
                echo "Branch '$branch' is outside docs/*|fix/*, but the PR body requests [auto merge]."
              else
                echo "Branch '$branch' is neither docs/* nor fix/* — leaving the merge to a human."
                echo "skip=yes" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Merging PR #$pr (branch $branch)."

      # The squash commit message carries the PR description too, so closing
      # keywords like "Fixes #N" written in the description land on main and
      # auto-close the linked issue (the bot merge itself does not close it).
      - name: Squash merge it
        if: steps.find.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.find.outputs.pr }}
        run: |
          title="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .title)"
          body="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // empty')"
          gh pr merge -R "${{ github.repository }}" "$PR" --squash \
            --subject "$title" --body "$body" || {
            echo "::warning::merge failed (review required or branch protected?) — merge manually."
            exit 1
          }

      # A merge made with GITHUB_TOKEN does not fire a `push` event
      # (recursion guard), so CI on main never runs on its own.
      # workflow_dispatch is the documented exception: dispatching it with
      # GITHUB_TOKEN DOES start a run — which rebuilds and deploys the
      # roster page.
      - name: Kick CI on main to rebuild the site
        if: steps.find.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml -R "${{ github.repository }}" --ref main
          echo "CI dispatched on main — the roster will rebuild."
